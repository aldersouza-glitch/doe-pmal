name: Robô DOE-AL PMAL

on:
  schedule:
    - - cron: "5 9 * * 1-5"
    - cron: "15 9 * * 1-5"
    - cron: "25 9 * * 1-5"
    - cron: "35 9 * * 1-5"
    - cron: "45 9 * * 1-5"
    - cron: "55 9 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "0 20 * * 1-5"
    - cron: "50 2 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    env:
      EMAIL_ROBO: aldersouza@gmail.com
      EMAIL_CONFIGURADO: ${{ secrets.MAIL_PASSWORD != '' }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar o robô
        run: python scraper.py

      - name: Verificar novidades
        id: novidades
        run: |
          if [ -s novas.txt ]; then
            echo "tem=true" >> "$GITHUB_OUTPUT"
            echo "anexos=$(paste -sd, novas.txt)" >> "$GITHUB_OUTPUT"
            qtd=$(wc -l < novas.txt)
            if [ "$qtd" -gt 1 ]; then
              assunto="DOE-AL — Clipping PMAL de hoje (${qtd} edições)"
            else
              assunto="DOE-AL — Clipping PMAL de hoje"
            fi
            echo "assunto=$assunto" >> "$GITHUB_OUTPUT"
            {
              echo "corpo<<FIM"
              echo "Novo(s) compilado(s) da PMAL no Diário Oficial de Alagoas:"
              echo ""
              cat resumo.txt
              echo ""
              if [ "$qtd" -gt 1 ]; then
                echo "Foram encontradas ${qtd} edições hoje (edição normal e/ou suplemento(s))."
                echo "Os PDFs seguem em anexo, um para cada edição."
              else
                echo "O PDF compilado segue em anexo."
              fi
              echo "Enviado automaticamente pelo Robô DOE-PMAL."
              echo "FIM"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tem=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar e-mail com o(s) PDF(s) compilado(s)
        if: steps.novidades.outputs.tem == 'true' && env.EMAIL_CONFIGURADO == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.EMAIL_ROBO }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Robô DOE-PMAL <${{ env.EMAIL_ROBO }}>
          to: ${{ env.EMAIL_ROBO }}
          subject: ${{ steps.novidades.outputs.assunto }}
          body: ${{ steps.novidades.outputs.corpo }}
          attachments: ${{ steps.novidades.outputs.anexos }}

      - name: Salvar resultados
        run: |
          rm -f novas.txt resumo.txt
          git config user.name "robo-doe-pmal"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sem novidades."
          else
            git commit -m "Compilação automática $(date -u +'%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Tentativa $i falhou, aguardando..."
              sleep 5
            done
          fi
